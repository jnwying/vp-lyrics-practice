<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VP Lyrics Control</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
    <link rel="stylesheet" href="import-guide.css">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="main-header">


        <!-- LEFT SIDE -->

        <div class="header-left">

            <h1>
                VP LYRICS CONTROL
            </h1>


            <!-- TABS -->

            <div class="tabs">

                <button
                    id="songsTabButton"
                    class="tab-button active"
                    onclick="switchTab('songs')"
                >
                    SONGS
                </button>


                <button
                    id="importTabButton"
                    class="tab-button"
                    onclick="switchTab('import')"
                >
                    IMPORT
                </button>


                <button
                    id="editTabButton"
                    class="tab-button"
                    onclick="switchTab('edit')"
                >
                    EDIT
                </button>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="top-controls">


            <!-- OUTPUT ON -->

            <button
                id="outputOnButton"
                class="output-on active"
                onclick="turnOutputOn()"
            >
                ● ON
            </button>


            <!-- OUTPUT OFF -->

            <button
                id="outputOffButton"
                class="output-off"
                onclick="turnOutputOff()"
            >
                ● OFF
            </button>


            <!-- MANAGEMENT MENU -->

            <button
                class="menu-button"
                onclick="toggleManagementMenu(event)"
                title="Song Management"
            >
                ⚙
            </button>

        </div>

    </header>



    <!-- =====================================================
         SONG MANAGEMENT POPUP
    ====================================================== -->

    <div
        id="managementPopup"
        class="management-popup"
    >


        <div class="popup-header">

            <span>
                SONG MANAGEMENT
            </span>


            <button
                class="popup-close"
                onclick="closeManagementMenu()"
            >
                ×
            </button>

        </div>


        <div class="popup-actions">


            <button
                onclick="addSong(); closeManagementMenu();"
            >
                + ADD SONG
            </button>


            <button
                onclick="deleteSong(); closeManagementMenu();"
            >
                DELETE SONG
            </button>


            <button
                onclick="manualSaveLibrary(); closeManagementMenu();"
            >
                SAVE LIBRARY
            </button>


            <button
                onclick="resetLibrary(); closeManagementMenu();"
            >
                RESET LIBRARY
            </button>
            <div class="settings-divider"></div>


            <div class="settings-divider"></div>

<div class="transition-settings">
    <div class="transition-settings-title">TRANSITION</div>

    <label for="transitionTimeRange">
        Transition Timing
    </label>

    <div class="transition-control">
        <input
            type="range"
            id="transitionTimeRange"
            min="0"
            max="500"
            step="10"
            value="300"
            oninput="saveTransitionSetting(this.value)"
        >

        <span id="transitionTimeValue">0.30 sec</span>
    </div>

    <div class="manual-transition">
        <label for="transitionTimeManual">
            Manual Timing
        </label>

        <div class="manual-transition-input">
            <input
                type="number"
                id="transitionTimeManual"
                min="0"
                max="5"
                step="0.01"
                value="0.30"
                onchange="saveManualTransitionSetting(this.value)"
            >

            <span>sec</span>
        </div>
    </div>
</div>


        </div>

    </div>



    <!-- =====================================================
         MAIN CONTAINER
    ====================================================== -->

    <main class="main-container">


        <!-- =================================================
             OUTPUT PREVIEW
        ================================================== -->

        <section class="preview-panel">


            <div class="preview-title">
                OUTPUT PREVIEW
            </div>


            <div
                id="lyric"
                class="lyric-output"
            >
                READY
            </div>


        </section>



        <!-- =================================================
             CONTROLS
        ================================================== -->

        <section class="controls-panel">


            <!-- =============================================
                 SONGS TAB
            ============================================== -->

            <div
                id="songsTab"
                class="tab-content active"
            >


                <!-- CURRENT SONG -->

                <div class="current-song">

                    <div class="current-song-label">
                        CURRENT SONG
                    </div>


                    <h2 id="songTitleDisplay">
                        Song: The Blood
                    </h2>

                </div>



                <!-- SONG LIBRARY -->

                <div class="song-library-panel">


                    <div class="panel-title">
                        SONG LIBRARY
                    </div>


                    <div id="songLibrary"></div>


                </div>



                <!-- SECTIONS / SLIDES -->

                <div id="sections">
                </div>



                <!-- ADD SECTION -->

                <button
                    class="add-section-button"
                    onclick="addSection()"
                >
                    + ADD SECTION
                </button>


            </div>



            <!-- =================================================
                 IMPORT TAB
            ================================================== -->

            <div
                id="importTab"
                class="tab-content"
            >


                <div class="tab-heading">
                    IMPORT LYRICS
                </div>


                <div class="import-description">

                    Paste your lyrics below.

                    <br><br>

                    Use headings such as:

                    <br>

                    <strong>
                        Verse 1
                    </strong>

                    <br>

                    <strong>
                        Chorus
                    </strong>

                    <br>

                    <strong>
                        Bridge 1
                    </strong>

                    <br>

                    <strong>
                        Pre-Chorus
                    </strong>

                    <br>

                    <strong>
                        Outro
                    </strong>

                    <br>

                    <strong>
                        Tag
                    </strong>

                </div>


                <textarea
                    id="lyricsInput"
                    class="lyrics-input"
                    placeholder="Paste your lyrics here..."
                ></textarea>


                <button
                    class="primary-button"
                    onclick="importLyrics()"
                >
                    IMPORT LYRICS
                </button>


            </div>



            <!-- =================================================
                 EDIT TAB
            ================================================== -->

            <div
                id="editTab"
                class="tab-content"
            >


                <div class="tab-heading">
                    EDIT SONG
                </div>



                <!-- SONG TITLE -->

                <div class="form-group">

                    <label for="songTitle">
                        SONG TITLE
                    </label>


                    <input
                        id="songTitle"
                        type="text"
                        placeholder="Song title"
                    >

                </div>



                <!-- SAVE SONG -->

                <button
                    class="primary-button"
                    onclick="saveSong()"
                >
                    SAVE SONG
                </button>



                <!-- SECTION EDITOR -->

                <div
                    id="sectionEditor"
                    class="section-editor-container"
                >
                </div>


                <!-- ADD SECTION -->

                <button
                    class="add-section-button"
                    onclick="addSection()"
                >
                    + ADD SECTION
                </button>


            </div>


        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
